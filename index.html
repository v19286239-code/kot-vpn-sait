
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b16">

    <title>Kot_VPN — личный кабинет</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">
                <img src="logo.jpeg" alt="Kot_VPN">
            </div>
            <div>
                <h1>Kot_VPN</h1>
                <p class="subtitle">Твой цифровой комфорт</p>
            </div>
        </header>

        <section class="hero">
            <h2>Интернет.<br><span>На твоих условиях.</span></h2>
            <p>Управляй подпиской Kot_VPN в одном месте.</p>
        </section>

        <section class="card subscription">
            <h3>Моя подписка</h3>
            <p id="plan-name">Нет подписки</p>
            <p id="plan-status">Выбери тариф для теста</p>
            <button class="button primary" id="subscription-button"
                data-action="connect">
                Посмотреть тарифы
            </button>
        </section>

        <section class="section" id="plans">
            <h3>Выбери свой план</h3>

            <article class="card plan">
                <h4>1 месяц</h4>
                <p>1 ₽</p>
                <button class="button secondary" data-plan="30"
                    data-action="buy" data-plan="1">
                    Выбрать
                </button>
            </article>

            <article class="card plan">
                <h4>3 месяца</h4>
                <p>1 ₽</p>
                <button class="button primary" data-plan="90"
                    data-action="buy" data-plan="3">
                    Выбрать
                </button>
            </article>

            <article class="card plan">
                <h4>12 месяцев</h4>
                <p>1 ₽</p>
                <button class="button secondary" data-plan="365"
                    data-action="buy" data-plan="12">
                    Выбрать
                </button>
            </article>
        </section>

        <section class="card help-card">
            <h3>Нужна помощь?</h3>
            <button class="icon-button" id="support-button"
                data-action="support">
                Поддержка
            </button>
        </section>

        <footer>
            <p>Kot_VPN · версия 0.1</p>
        </footer>
    </main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./app.js"></script>
</body>
</html>
